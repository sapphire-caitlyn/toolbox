<ion-content>
  <div id="backgound" style="background-color: #C8C2AA">
    <div id="foreground">
      <div class="anim_circle" id="top_left_circle"></div>
      <div class="anim_circle" id="bottom_right_circle"></div>
      <div class="anim_circle" id="bottom_right_circle-2"></div>
      <div class="anim_circle" id="top_left_circle-2"></div>
      <div id="lines_left_container">
        <div id="line_1"></div>
        <div id="line_2"></div>
        <div id="line_3"></div>
      </div>
      <div id="lines_right_container">
        <div id="line_1"></div>
        <div id="line_2"></div>
        <div id="line_3"></div>
      </div>
    </div>
    <div id="content">
      <header id="navbar">
        <div style="display: flex; flex-direction: row;">
          <ion-grid>
            <ion-row class="content" style="padding-left: 2rem; margin-bottom: 1em;">
              <ion-col *ngFor="let menu of menus; let i = index" [style]="'width: Calc(100% / ' + (menus.length - 1) + ' );'">
                <nier-button
                  [routerLink]="[(menu.Disabled ? '' : ('/' + menu.Route) )]"
                  style="width: 100%; position: relative;"
                  (click)="current = i"
                  [force_hover]="current == i"
                  [menu]="current == i"
                  [button_text]="menu.Name"
                  [disabled]="menu.Disabled">
                </nier-button>
              </ion-col>
            </ion-row>
          </ion-grid>
        </div>

        <div class="pattern">
          <div class="container">
            <div class="pattern-inner"></div>
          </div>
        </div>
      </header>

      <div style=" width: 100%; height: 86.6vh; position: relative; z-index: 1000;" (mouseenter)="hovering = -1">
        <ion-router-outlet></ion-router-outlet>
      </div>

      <div class="pattern pattern-bottom">
        <div class="container">
          <div class="pattern-inner"></div>
        </div>
      </div>
    </div>
  </div>
</ion-content>
